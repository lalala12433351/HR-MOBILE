<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Board card check</title>
<style>
  body { margin: 0; font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; color: #172234; background: #fff; }
  .frame { width: 390px; padding: 20px; box-sizing: border-box; }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 0 0 12px; }
  .head h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .head span { font-size: 12px; line-height: 20px; color: #687789; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card { display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid #dde4e9; border-radius: 8px; background: #fff; }
  .project { display: flex; align-items: center; justify-content: space-between; min-height: 24px; font-size: 12px; line-height: 16px; color: #5e6c7b; }
  .project button { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin: 0; padding: 0; border: 0; background: transparent; letter-spacing: 1px; }
  h4 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; }
  .meta { font-size: 12px; font-weight: 600; color: #a65c00; }
  .foot { display: flex; align-items: center; justify-content: space-between; min-height: 24px; font-size: 12px; color: #687789; }
  .who { display: flex; align-items: center; min-width: 0; }
  .who b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #efe6fb; color: #6d28d9; font-size: 10px; }
  .who span { margin-left: 8px; line-height: 16px; color: #172234; }
  .stats { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="head"><h3>To Do</h3><span>1</span></div>
    <div class="list">
      <article class="card">
        <div class="project"><span>PRJ-002 · Hr Solutions</span><button type="button" aria-label="Details">···</button></div>
        <h4>Fixing HR Bugs</h4>
        <div class="meta">High</div>
        <div class="foot"><div class="who"><b>NC</b><span>Neeraj Ciju</span></div><div class="stats"><span>0</span><span>0</span><span>2h 49m</span></div></div>
      </article>
    </div>
  </div>
</body>
</html>
