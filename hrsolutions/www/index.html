<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>HR Solutions</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .card {
        max-width: 22rem;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #64748b;
        line-height: 1.5;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>HR Solutions</h1>
      <p>
        The mobile frontend has not loaded. Start <code>npm run mobile:dev</code> in <code>hrsolutions</code>, then sync the native project with <code>npm run cap:sync:android</code> or <code>npm run cap:sync:ios</code>. Installed builds need the URL of this repository’s deployed UI.
      </p>
    </div>
  </body>
</html>
