name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      server_url:
        description: Capacitor server URL loaded in the WebView
        required: true
        default: https://app.pixbe.in
  push:
    branches: [main, master]
    paths:
      - 'hrsolutions/android/**'
      - 'hrsolutions/capacitor.config.ts'
      - 'hrsolutions/package.json'
      - 'hrsolutions/package-lock.json'
      - 'hrsolutions/www/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'hrsolutions/android/**'
      - 'hrsolutions/capacitor.config.ts'
      - 'hrsolutions/package.json'
      - 'hrsolutions/package-lock.json'
      - 'hrsolutions/www/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ${{ github.event.inputs.build_type || 'debug' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrsolutions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hrsolutions/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google no longer publishes the legacy `tools` package; v4 defaults to platform-tools only.
          packages: platform-tools

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || 'https://app.pixbe.in' }}

      - name: Decode release keystore
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for release builds"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        if: ${{ (github.event.inputs.build_type || 'debug') == 'debug' }}
        working-directory: hrsolutions/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        working-directory: hrsolutions/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        if: ${{ (github.event.inputs.build_type || 'debug') == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: hr-solutions-debug-apk
          path: hrsolutions/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: ${{ (github.event.inputs.build_type || 'debug') == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: hr-solutions-release-apk
          path: hrsolutions/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
